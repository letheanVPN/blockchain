name: Push Compile
permissions:
  contents: write
  packages: write
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'main'
      - 'dev-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-intel:
    name: Linux
    uses: ./.github/workflows/build-linux-intel.yml
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-linux-arm:
    name: Linux
    uses: ./.github/workflows/build-linux-arm64.yml
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-windows-intel:
    name: Windows
    uses: ./.github/workflows/build-windows-intel.yml
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-macos-arm64:
    name: MacOS
    uses: ./.github/workflows/build-macos-arm64.yml
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-macos-intel:
    name: MacOS
    uses: ./.github/workflows/build-macos-intel.yml
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-docker:
    name: Docker
    uses: ./.github/workflows/build-docker.yml
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}
    secrets: inherit

  build-docs:
    name: Docs
    uses: ./.github/workflows/build-docs.yml
