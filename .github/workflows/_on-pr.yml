name: PR
permissions:
  contents: write
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  pull_request_review:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-intel:
    name: Linux
    if: ${{!github.event.pull_request.draft}}
    uses: ./.github/workflows/build-linux-intel.yml
    secrets: inherit
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-linux-arm:
    name: Linux
    if: ${{!github.event.pull_request.draft}}
    uses: ./.github/workflows/build-linux-arm64.yml
    secrets: inherit
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-windows-intel:
    name: Windows
    if: ${{!github.event.pull_request.draft}}
    uses: ./.github/workflows/build-windows-intel.yml
    secrets: inherit
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-macos-arm64:
    name: MacOS
    uses: ./.github/workflows/build-macos-arm64.yml
    secrets: inherit
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-macos-intel:
    name: MacOS
    if: ${{!github.event.pull_request.draft}}
    uses: ./.github/workflows/build-macos-intel.yml
    secrets: inherit
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-docker:
    name: Docker
    if: ${{!github.event.pull_request.draft}}
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit
    with:
      chain-network: ${{ github.ref_name == 'main' && 'mainnet' || 'testnet' }}

  build-docs:
    name: Docs
    if: ${{!github.event.pull_request.draft}}
    uses: ./.github/workflows/build-docs.yml
